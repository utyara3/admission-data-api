services:
  api:
    build: .
    container_name: admission-data-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_TO_FILE=true
      - LOG_DIR=/app/logs
    volumes:
      - ./src:/app/src:ro
      - ./logs:/app/logs
      - ./pyproject.toml:/app/pyproject.toml:ro
    restart: unless-stopped

    
