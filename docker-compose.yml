services:
  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: admission-data-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_TO_FILE=true
      - LOG_DIR=/app/logs
      - DATABASE_HOST=db
      - REDIS_HOST=redis
    volumes:
      - ./src:/app/src:ro
      - ./logs:/app/logs
      - ./pyproject.toml:/app/pyproject.toml:ro
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build: .
    container_name: admission-celery-worker
    entrypoint: []
    command: celery -A src.tasks worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_HOST=db
      - REDIS_HOST=redis
    volumes:
      - ./src:/app/src:ro
      - ./logs:/app/logs
      - ./pyproject.toml:/app/pyproject.toml:ro
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    container_name: admission-celery-beat
    entrypoint: []
    command: celery -A src.tasks beat --loglevel=info
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_HOST=db
      - REDIS_HOST=redis
    volumes:
      - ./src:/app/src:ro
      - ./logs:/app/logs
      - ./pyproject.toml:/app/pyproject.toml:ro
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
